[package]
name = "vitae"
version = "1.1.4"
description = "A Tauri-based LaTeX resume builder"
authors = ["Jonathan Correa"]
license = "MIT"
repository = "https://github.com/TheJonathanC/vitae"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["updater", "dialog-save", "shell-open", "process-relaunch", "window-close"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.30", features = ["bundled"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
reqwest = { version = "0.11", features = ["json"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
