name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel (beta or stable)'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - stable
      version:
        description: 'Version string (optional, e.g. 1.1.2 or 1.1.2-beta.2)'
        required: false
        type: string

# Least privilege by default; only the release job can write.
permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run Frontend unit tests (Vitest)
        run: npm test

      - name: Run Backend unit tests (Cargo)
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

  build-and-release:
    name: Build & Publish Release
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    # One release at a time so two runs can't race on the update manifests.
    # A newer queued run replaces an older queued one; a running one finishes.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci

      # Version rules (see RELEASING.md) are enforced in scripts/release.mjs:
      # betas sort above the newest stable release, stable versions only move
      # forward, and existing tags are never reused for a different commit.
      - name: Determine Version & Channel
        id: versioning
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/release.mjs version

      - name: Update versions in configuration files
        shell: pwsh
        run: |
          $ver = "${{ steps.versioning.outputs.version }}"
          $channel = "${{ steps.versioning.outputs.channel }}"
          
          # Update package.json
          $pkg = Get-Content ./package.json -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 10 | Set-Content ./package.json
          
          # Update src-tauri/tauri.conf.json
          $tauriConf = Get-Content ./src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauriConf.package.version = $ver
          if ($channel -eq "beta") {
            $tauriConf.tauri.updater.endpoints = @("https://github.com/${{ github.repository }}/releases/download/latest-beta/latest-beta.json")
          } else {
            $tauriConf.tauri.updater.endpoints = @("https://github.com/${{ github.repository }}/releases/latest/download/latest.json")
          }

          # MSI (WiX) cannot handle alphanumeric pre-release identifiers (e.g. -beta.X)
          # due to Windows Installer schema limits (must be numeric-only <= 65535).
          # Use NSIS for pre-releases, and both NSIS and MSI for stable numeric releases.
          if ($ver -match "[a-zA-Z]") {
            $tauriConf.tauri.bundle.targets = @("nsis")
          } else {
            $tauriConf.tauri.bundle.targets = @("nsis", "msi")
          }

          # The frontend is built in its own step without signing secrets, so
          # npm build tooling never sees TAURI_PRIVATE_KEY.
          $tauriConf.build.PSObject.Properties.Remove('beforeBuildCommand')

          $tauriConf | ConvertTo-Json -Depth 10 | Set-Content ./src-tauri/tauri.conf.json
          
          # Update Cargo.toml [package] version only (anchored to line start so dependencies are untouched)
          $cargoContent = Get-Content ./src-tauri/Cargo.toml -Raw
          $cargoContent = [regex]::new('(?m)^version\s*=\s*"[^"]+"').Replace($cargoContent, "version = `"$ver`"", 1)
          $cargoContent | Set-Content ./src-tauri/Cargo.toml

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Application
        shell: pwsh
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          npm run tauri build

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./release-assets | Out-Null
          $bundleDir = "./src-tauri/target/release/bundle"
          Get-ChildItem -Path $bundleDir -Recurse -Include *-setup.exe, *-setup.exe.sig, *.msi |
            Copy-Item -Destination ./release-assets/
          Get-ChildItem ./release-assets | Format-Table Name, Length

      # Signs the NSIS installer if the bundler didn't, verifies the signature
      # against the updater pubkey the app ships with (a mismatch would make every
      # in-app update fail), and writes latest.json / latest-beta.json.
      - name: Sign, verify & write updater manifests
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.versioning.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.versioning.outputs.channel }}
          RELEASE_TAG: ${{ steps.versioning.outputs.tag }}
        run: node scripts/release.mjs manifest release-assets

      # `gh release create` uploads every asset to a draft and publishes it only
      # afterwards, so `releases/latest/download/latest.json` never points at a
      # release that is missing its manifest.
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.versioning.outputs.tag }}
          CHANNEL: ${{ steps.versioning.outputs.channel }}
        run: |
          $files = Get-ChildItem ./release-assets -File | ForEach-Object { $_.FullName }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists (re-run); replacing its assets"
            gh release upload $env:TAG @files --clobber
          } else {
            $flags = if ($env:CHANNEL -eq "stable") { @("--latest") } else { @("--prerelease", "--latest=false") }
            gh release create $env:TAG @files --target $env:GITHUB_SHA --title "Vitae $env:TAG" --generate-notes @flags
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The beta channel reads releases/download/latest-beta/latest-beta.json. The
      # manifest links to the versioned release, so the rolling release only holds
      # the manifest. It is updated in place (never deleted) so the feed stays up.
      - name: Update rolling beta channel
        if: hashFiles('release-assets/latest-beta.json') != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f latest-beta $env:GITHUB_SHA
          git push -f origin refs/tags/latest-beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release view latest-beta *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest-beta ./release-assets/latest-beta.json --prerelease --latest=false `
              --title "Vitae (Beta Channel - Rolling)" `
              --notes "Update feed for the beta channel. Download installers from the versioned releases."
          } else {
            gh release upload latest-beta ./release-assets/latest-beta.json --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $stale = gh release view latest-beta --json assets -q '.assets[].name' | Where-Object { $_ -ne "latest-beta.json" }
            foreach ($asset in $stale) { gh release delete-asset latest-beta $asset --yes }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
